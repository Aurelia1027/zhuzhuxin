[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["docs/character/*.md", "!.env", "!.env.*", "!**/.env", "!**/.env.*", "!backups/**", "!releases/**", "!assets/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/lumi/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
