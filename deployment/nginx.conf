# Include inside nginx's http context (e.g. sites-enabled). Replace the example domain.
limit_req_zone $binary_remote_addr zone=lumi_api:10m rate=10r/m;
server {
    listen 80;
    server_name lumi.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name lumi.example.com;
    ssl_certificate /etc/letsencrypt/live/lumi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/lumi-room/current/dist;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location ^~ /api/ {
        limit_req zone=lumi_api burst=10 nodelay;
        limit_req_status 429;
        limit_except GET POST { deny all; }
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_http_version 1.1;
        proxy_read_timeout 190s;
        proxy_buffering off;
    }
    location ~ (^|/)\. { return 404; }
    location ^~ /docs/ { return 404; }
    location ^~ /server/ { return 404; }
    location ^~ /assets/ { try_files $uri =404; expires 7d; }
    location ^~ /models/ { try_files $uri =404; expires 1d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
